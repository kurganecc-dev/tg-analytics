# Ежедневное обновление данных и публикация: сервис остаётся статическим,
# свежие посты приезжают коммитом в data/report-data.json.
name: Обновить данные каналов

on:
  schedule:
    - cron: '17 5 * * *'      # каждый день в 05:17 UTC (08:17 МСК)
  workflow_dispatch:           # и по кнопке в разделе Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Скачать каналы из channels.txt
        run: |
          set -euo pipefail
          mkdir -p data
          # зависимостей нет: fetch_channel.py работает на стандартной библиотеке
          while read -r name months subs; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            echo "→ $name (${months:-12} мес.)"
            python3 scripts/fetch_channel.py "$name" \
              --months "${months:-12}" \
              --out "data/${name#@}.jsonl" \
              ${subs:+--subs "$subs"} \
              --delay 1.2
          done < channels.txt

      - name: Собрать отчёт и автономный файл
        run: |
          set -euo pipefail
          # порядок каналов в отчёте = порядок строк в channels.txt (первый канал открывается по умолчанию)
          files=""
          while read -r name months subs; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            files="$files data/${name#@}.jsonl"
          done < channels.txt
          echo "каналы в отчёте: $files"
          python3 scripts/build_report.py $files
          python3 scripts/build_report.py --embed --out report.html $files

      - name: Закоммитить изменения
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data report.html
          if git diff --quiet --cached; then
            echo "данные не изменились"
            exit 0
          fi
          git commit -m "данные: обновление $(date -u +%F)"
          # пока шёл обход каналов, в main мог прилететь чужой коммит: подтягиваем и повторяем,
          # а при конфликте в данных оставляем свежесобранные файлы (они новее по определению)
          for attempt in 1 2 3; do
            if git push; then echo "запушено (попытка $attempt)"; exit 0; fi
            echo "push отклонён — подтягиваю изменения и повторяю"
            git pull --rebase --autostash origin main || true
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git checkout --theirs -- data report.html 2>/dev/null || true
              git add data report.html
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 5))
          done
          echo "не удалось запушить после трёх попыток" >&2
          exit 1
